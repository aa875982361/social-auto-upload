version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: sau-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2024
      MYSQL_DATABASE: social_auto_upload
      MYSQL_USER: sau_user
      MYSQL_PASSWORD: sau_password
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    ports:
      - "3306:3306"
    networks:
      - sau-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_2024"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sau-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_ENV=true
      - FLASK_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=sau_user
      - DB_PASSWORD=sau_password
      - DB_NAME=social_auto_upload
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./videoFile:/app/videoFile
      - ./media:/app/media
      - ./ssl:/app/ssl
    ports:
      - "5409:5409"
    networks:
      - sau-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5409/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务
  frontend:
    build:
      context: ./sau_frontend
      dockerfile: Dockerfile
    container_name: sau-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sau-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: sau-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sau-network
    profiles:
      - production

networks:
  sau-network:
    driver: bridge

volumes:
  mysql_data:
  data:
  logs:
  videoFile:
  media:
