version: '3.3'

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sau-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_ENV=true
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./videoFile:/app/videoFile
      - ./media:/app/media
      - ./ssl:/app/ssl
      - ./cookiesFile:/app/cookiesFile
      # 注意：不再挂载 ./db，数据库现在存储在 ./data/db 中
    ports:
      - "5409:5409"
    networks:
      - sau-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5409/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    build:
      context: ./sau_frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5409}
    container_name: sau-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - sau-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理（已禁用，使用服务器nginx）
  # nginx:
  #   image: nginx:alpine
  #   container_name: sau-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   networks:
  #     - sau-network
  #   profiles:
  #     - production

networks:
  sau-network:
    driver: bridge

volumes:
  data:
  logs:
  videoFile:
  media:
