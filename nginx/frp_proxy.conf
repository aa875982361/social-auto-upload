# FRP反向代理配置
# 用于将FRP穿透的服务通过Nginx进行反向代理和负载均衡

# 上游服务器配置 - FRP穿透的服务
upstream frp_backend {
    # 这里配置FRP穿透后的后端服务地址
    # 根据你的FRP配置，这里应该是穿透后的地址
    server 127.0.0.1:8080;  # FRP HTTP代理端口
    # 如果有多个实例，可以添加更多服务器
    # server 127.0.0.1:8081;
    # server 127.0.0.1:8082;
}

upstream frp_frontend {
    # FRP穿透后的前端服务地址
    server 127.0.0.1:8080;  # FRP HTTP代理端口
}

# HTTP服务器配置 - 处理FRP穿透的请求
server {
    listen 80;
    server_name your-domain.com *.your-domain.com;  # 替换为你的域名
    
    # 日志配置
    access_log /var/log/nginx/frp_access.log;
    error_log /var/log/nginx/frp_error.log;
    
    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # 文件上传大小限制
    client_max_body_size 160M;
    
    # 前端静态文件代理
    location / {
        proxy_pass http://frp_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # API代理到后端
    location /api/ {
        proxy_pass http://frp_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 支持大文件上传
        client_max_body_size 160M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # SSE支持
    location /login {
        proxy_pass http://frp_backend/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE配置
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
    
    # 其他API路由
    location ~ ^/(upload|getFile|uploadSave|getFiles|deleteFile|getValidAccounts|postVideo|updateUserinfo|postVideoBatch|deleteAccount) {
        proxy_pass http://frp_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 支持大文件上传
        client_max_body_size 160M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    
    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://frp_frontend;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS服务器配置（如果需要SSL）
server {
    listen 443 ssl http2;
    server_name your-domain.com *.your-domain.com;  # 替换为你的域名
    
    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # 日志配置
    access_log /var/log/nginx/frp_ssl_access.log;
    error_log /var/log/nginx/frp_ssl_error.log;
    
    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 文件上传大小限制
    client_max_body_size 160M;
    
    # 前端静态文件代理
    location / {
        proxy_pass http://frp_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # API代理到后端
    location /api/ {
        proxy_pass http://frp_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 支持大文件上传
        client_max_body_size 160M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    
    # 其他配置与HTTP相同...
    # （为了简洁，这里省略重复的配置）
}