[common]
# FRP服务端地址和端口
server_addr = your-server-ip
server_port = 7000

# 认证token（与服务端保持一致）
token = your_frp_token_here

# 日志配置
log_file = /var/log/frpc.log
log_level = info
log_max_days = 3

# 管理后台配置
admin_addr = 127.0.0.1
admin_port = 7400
admin_user = admin
admin_pwd = admin123

# HTTP代理配置 - 前端服务
[frontend]
type = http
local_ip = frontend
local_port = 80
subdomain = app
use_encryption = false
use_compression = true
host_header_rewrite = localhost

# HTTP代理配置 - 后端API服务
[backend]
type = http
local_ip = backend
local_port = 5409
subdomain = api
use_encryption = false
use_compression = true
host_header_rewrite = localhost

# HTTPS代理配置 - 前端服务
[frontend-https]
type = https
local_ip = frontend
local_port = 80
subdomain = app-https
use_encryption = false
use_compression = true

# HTTPS代理配置 - 后端API服务
[backend-https]
type = https
local_ip = backend
local_port = 5409
subdomain = api-https
use_encryption = false
use_compression = true

# TCP代理配置（可选，用于SSH等）
[ssh]
type = tcp
local_ip = 127.0.0.1
local_port = 22
remote_port = 6000
use_encryption = false
use_compression = true

# 自定义域名配置（可选）
[custom-domain]
type = http
local_ip = frontend
local_port = 80
custom_domains = your-custom-domain.com
use_encryption = false
use_compression = true
