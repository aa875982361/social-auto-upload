# 社交媒体自动上传项目 - 服务器nginx配置
# 将此配置添加到你的服务器nginx配置中

# HTTP重定向到HTTPS
server {
    listen 80;
    server_name upload.nisonfuture.cn;  # 替换为你的新域名
    return 301 https://$server_name$request_uri;
}

# HTTPS配置
server {
    listen 443 ssl http2;
    server_name upload.nisonfuture.cn;  # 替换为你的新域名

    # SSL证书配置（替换为你的证书路径）
    ssl_certificate /etc/ssl/upload.nisonfuture.cn.pem;
    ssl_certificate_key /etc/ssl/upload.nisonfuture.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 文件上传大小限制
    client_max_body_size 160M;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # 前端静态文件 - 代理到容器的8080端口
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API代理到后端 - 代理到容器的5409端口
    location /api/ {
        proxy_pass http://127.0.0.1:5409/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 支持大文件上传
        client_max_body_size 160M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # SSE支持
    location /login {
        proxy_pass http://127.0.0.1:5409/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE配置
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # 其他API路由
    location ~ ^/(upload|getFile|uploadSave|getFiles|deleteFile|getValidAccounts|postVideo|updateUserinfo|postVideoBatch|deleteAccount) {
        proxy_pass http://127.0.0.1:5409$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 支持大文件上传
        client_max_body_size 160M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
